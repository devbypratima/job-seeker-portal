{% extends 'base.html' %}
{% block title %}Delete Job — JobPortal{% endblock %}
{% block content %}
<div class="auth-page" style="padding-top:4rem;align-items:flex-start">
    <div class="auth-card" style="max-width:480px">
        <div class="card" style="border-color:var(--danger)">
            <div class="card-body" style="text-align:center;padding:3rem 2rem">
                <div style="font-size:4rem;color:var(--danger);margin-bottom:1.5rem"><i
                        class="fas fa-exclamation-triangle"></i></div>
                <h2 style="font-size:1.6rem;font-weight:800;margin-bottom:.5rem">Delete Job Listing?</h2>
                <p style="color:var(--text-muted);font-size:1.05rem;margin-bottom:2rem">Are you sure you want to delete
                    the job <strong>"{{ job.title }}"</strong>? This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div style="display:flex;gap:1rem">
                        <button type="submit" class="btn btn-danger" style="flex:1"><i class="fas fa-trash"></i> Delete
                            Job</button>
                        <a href="{% url 'company_dashboard' %}" class="btn btn-outline" style="flex:1">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
